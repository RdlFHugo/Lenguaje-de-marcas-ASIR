<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>

            <th>Columna 1 </th> <!--El encabezado-->

            <th>Columna 3</th>
            
        </tr>

        <tr>

            <td>Madrid</td> <!--Contenido-->
            <td>Barcelona</td>
            <td>Valencia</td>

        </tr>
        <tr>

            <td>Calle 1</td>
            <td>Calle 2</td>
            <td>Calle 3</td>

        </tr>  
    </table>
</body>
</html>
