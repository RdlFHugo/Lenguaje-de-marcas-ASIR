<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Instalaciones Deportivas</title>
</head>
<body>
    <h2>Reserva de Instalaciones Deportivas</h2>
    <form method="post" action="formulario.php">
        <!-- Datos Personales -->
        <fieldset name="datosPersonales">
            <legend>Datos Personales</legend>
            <table border="1">
                <tr>
                    <td><label for="nombre">Nombre</label></td>
                    <td colspan="2"><input type="text" maxlength="50" size="50"></td>
                    <td><label for="domicilio">Domicilio</label></td>
                    <td colspan="2"><input type="text" maxlength="50" size="50"></td>
                </tr>
                <tr>
                    <td><label for="documento">Documento</label></td>
                    <td>
                        <select>
                            <option value=""></option>
                            <option value="dni">Documento Nacional de Identidad</option>
                            <option value="tarjeta_residencia">Tarjeta de Residencia</option>
                            <option value="pasaporte">Pasaporte</option>
                        </select>
                    </td>
                    <td><label for="numDoc">Número Doc.</label></td>
                    <td><input type="text" maxlength="15" size="20"></td>
                    <td><label for="sexo">Sexo</label></td>
                    <td>
                        <input type="radio" name="sexo"> Hombre
                        <input type="radio" name="sexo"> Mujer
                    </td>
                </tr>
                <tr>
                    <td><label for="telefono">Teléfono</label></td>
                    <td><input type="tel" maxlength="12" size="20"></td>
                    <td><label for="correo">Correo Electrónico</label></td>
                    <td colspan="3"><input type="email" maxlength="50" size="50"></td>
                </tr>
            </table>
        </fieldset>

        <!-- Datos de la Reserva -->
        <fieldset name="datosReserva">
            <legend>Datos de la Instalación a Reservar</legend>
            <table border="1">
                <tr>
                    <td><label for="instalacion">Instalación</label></td>
                    <td>
                        <select>
                            <option value=""></option>
                            <option value="futbol_exterior">Futbol Sala Exterior</option>
                            <option value="futbol_cubierta">Futbol Sala Cubierta</option>
                            <option value="baloncesto">Baloncesto</option>
                            <option value="multiproposito">Multipropósito</option>
                        </select>
                    </td>
                    <td><label for="fecha">Fecha</label></td>
                    <td><input type="date"></td>
                    <td><label for="horaInicio">Hora Inicio</label></td>
                    <td><input type="time"></td>
                    <td><label for="numHoras">Núm. Horas (max. 3 horas)</label></td>
                    <td><input type="number" min="1" max="3"></td>
                </tr>
                <tr>
                    <td colspan="2"><label for="iluminacion">Contratación de Iluminación</label></td>
                    <td colspan="2">
                        <input type="radio" name="ilum"> Sí
                        <input type="radio" name="ilum"> No
                    </td>
                </tr>
                <tr>
                    <td colspan="8">
                        <input type="checkbox">
                        <label>Acepta las condiciones del alquiler de las instalaciones y normas del complejo deportivo.</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="8" align="center">
                        <input type="submit" value="Proceder a la Reserva">
                        <input type="reset" value="Borrar Formulario">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
